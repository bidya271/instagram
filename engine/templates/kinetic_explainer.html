<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #07090e; color: #fff;
        -webkit-font-smoothing: antialiased;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #07090e;
      }
      .video-bg {
        position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1;
        transform: scale(1.02);
      }
      /* Dark atmospheric grading to ensure motion graphics pop with optical clarity */
      .ambient-overlay {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(7,9,14,0.4) 0%, rgba(7,9,14,0.75) 100%),
                    linear-gradient(to bottom, rgba(7,9,14,0.7) 0%, transparent 25%, transparent 75%, rgba(7,9,14,0.85) 100%);
        pointer-events: none; z-index: 2;
      }

      /* Minimal top progress indicator */
      .top-progress-track {
        position: absolute; top: 0; left: 0; right: 0; height: 4px;
        background: rgba(255, 255, 255, 0.12);
        z-index: 30;
      }
      .top-progress-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #60A5FA, #E2E8F0, #F59E0B);
        border-radius: 0 2px 2px 0;
      }

      /* Stage Container */
      .stage {
        position: absolute; inset: 0;
        padding: 120px 80px 140px 80px;
        display: flex; flex-direction: column; justify-content: space-between;
        z-index: 10;
      }

      /* Header Category Eyebrow */
      .header-bar {
        display: flex; align-items: center; justify-content: space-between;
        opacity: 0;
      }
      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.65);
        display: flex; align-items: center; gap: 12px;
      }
      .eyebrow::before {
        content: '';
        display: inline-block;
        width: 10px; height: 10px;
        border-radius: 50%;
        background: #3B82F6;
        box-shadow: 0 0 12px #3B82F6;
      }
      .series-tag {
        font-size: 22px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 0.05em;
      }

      /* Central Kinetic Card Canvas */
      .content-canvas {
        position: relative;
        width: 100%;
        min-height: 850px;
        display: flex; align-items: center; justify-content: center;
      }

      /* Beat 1: Big Pattern Interrupt Hook */
      .beat-hook {
        position: absolute; width: 100%;
        text-align: left;
        opacity: 0;
      }
      .hook-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 64px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.02em;
        color: #FFFFFF;
        text-shadow: 0 4px 24px rgba(0,0,0,0.8);
      }
      .hook-title .accent {
        font-style: italic;
        color: #FACC15;
        font-weight: 500;
      }
      .hook-subtitle {
        margin-top: 28px;
        font-size: 32px;
        font-weight: 400;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.78);
      }

      /* Beat 2 & Beat 3: Frosted Concept Insight Cards */
      .insight-card {
        position: absolute; width: 100%;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 28px;
        padding: 56px 48px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        opacity: 0;
      }
      .card-badge {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 8px 18px;
        background: rgba(59, 130, 246, 0.18);
        border: 1px solid rgba(59, 130, 246, 0.35);
        border-radius: 100px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #93C5FD;
        margin-bottom: 32px;
      }
      .card-heading {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 48px;
        font-weight: 600;
        line-height: 1.32;
        color: #FFFFFF;
        margin-bottom: 24px;
      }
      .card-body {
        font-size: 30px;
        font-weight: 400;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.82);
      }
      .card-body strong {
        color: #F8FAFC;
        font-weight: 700;
      }
      .highlight-strip {
        position: relative;
        display: inline-block;
      }
      .highlight-strip::after {
        content: '';
        position: absolute; bottom: 2px; left: 0; width: 100%; height: 8px;
        background: rgba(245, 158, 11, 0.4);
        z-index: -1;
        border-radius: 2px;
      }

      /* Beat 4: Climax Payoff & Loop Anchor */
      .beat-payoff {
        position: absolute; width: 100%;
        text-align: center;
        opacity: 0;
      }
      .payoff-badge {
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #F59E0B;
        margin-bottom: 24px;
      }
      .payoff-rule {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-size: 54px;
        font-weight: 600;
        line-height: 1.35;
        color: #FFFFFF;
        text-shadow: 0 4px 20px rgba(0,0,0,0.85);
      }
      .payoff-sub {
        margin-top: 32px;
        font-size: 28px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7);
        display: flex; align-items: center; justify-content: center; gap: 12px;
      }

      /* Footer Bar with subtle CTA */
      .footer-bar {
        display: flex; align-items: center; justify-content: space-between;
        opacity: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 28px;
      }
      .footer-brand {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: rgba(255, 255, 255, 0.9);
      }
      .footer-cta {
        display: flex; align-items: center; gap: 10px;
        font-size: 22px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.65);
      }
      .save-icon {
        width: 22px; height: 22px; fill: currentColor;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="1920">
      <!-- Natural 4K Multi-Shot Video Background -->
      <video id="bgVideo" src="assets/bg_video.mp4" class="clip video-bg" data-start="0" data-duration="{{duration}}" autoplay muted loop playsinline></video>
      <div class="ambient-overlay"></div>

      <!-- Top Reading Progress Bar -->
      <div class="top-progress-track">
        <div class="top-progress-fill" id="topProgress"></div>
      </div>

      <div class="stage">
        <!-- Header -->
        <div class="header-bar" id="headerBar">
          <div class="eyebrow">{{category}}</div>
          <div class="series-tag">{{rule_badge}}</div>
        </div>

        <!-- Dynamic Content Canvas -->
        <div class="content-canvas">
          <!-- Beat 1: Hook (0.0s - 3.2s) -->
          <div class="beat-hook" id="beatHook">
            <h1 class="hook-title">{{hook_title}}</h1>
            <p class="hook-subtitle">{{hook_sub}}</p>
          </div>

          <!-- Beat 2: Mechanism Card (3.3s - 7.0s) -->
          <div class="insight-card" id="beatMechanism">
            <div class="card-badge">01 // The Mechanism</div>
            <h2 class="card-heading">{{mechanism_heading}}</h2>
            <p class="card-body">{{mechanism_body}}</p>
          </div>

          <!-- Beat 3: Counter-Intuitive Truth (7.1s - 10.4s) -->
          <div class="insight-card" id="beatTruth">
            <div class="card-badge" style="background: rgba(245,158,11,0.18); border-color: rgba(245,158,11,0.35); color: #FCD34D;">02 // The Hard Truth</div>
            <h2 class="card-heading">{{truth_heading}}</h2>
            <p class="card-body">{{truth_body}}</p>
          </div>

          <!-- Beat 4: Climax Payoff & Loop Anchor (10.5s - 13.5s) -->
          <div class="beat-payoff" id="beatPayoff">
            <div class="payoff-badge">THE UNWRITTEN RULE</div>
            <div class="payoff-rule">{{payoff_rule}}</div>
            <div class="payoff-sub">
              <svg class="save-icon" viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
              <span>Save this before your next conversation</span>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="footer-bar" id="footerBar">
          <div class="footer-brand">{{book_title}}</div>
          <div class="footer-cta">
            <span>Swipe or Loop</span>
          </div>
        </div>
      </div>

      <audio id="masterAudio" src="assets/audio.mp3" class="clip" data-start="0" data-duration="{{duration}}"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const totalDur = {{duration}};

      // 1. Top Reading Bar & Persistent Chrome
      tl.to("#topProgress", { width: "100%", duration: totalDur, ease: "none" }, 0);
      tl.to("#headerBar", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.to("#footerBar", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.4);

      // 2. Beat 1: Hook (0.2s -> 3.2s)
      tl.fromTo("#beatHook", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.to("#beatHook", { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, 3.1);

      // 3. Beat 2: Mechanism Card (3.4s -> 6.9s)
      tl.fromTo("#beatMechanism", { opacity: 0, scale: 0.94, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.2)" }, 3.4);
      tl.to("#beatMechanism", { opacity: 0, scale: 0.96, y: -20, duration: 0.35, ease: "power2.in" }, 6.8);

      // 4. Beat 3: The Hard Truth Card (7.1s -> 10.3s)
      tl.fromTo("#beatTruth", { opacity: 0, scale: 0.94, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.2)" }, 7.1);
      tl.to("#beatTruth", { opacity: 0, scale: 0.96, y: -20, duration: 0.35, ease: "power2.in" }, 10.3);

      // 5. Beat 4: Climax Payoff & Loop Rule (10.6s -> end)
      tl.fromTo("#beatPayoff", { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 10.6);
      tl.to("#beatPayoff", { opacity: 0, duration: 0.35, ease: "power2.in" }, totalDur - 0.35);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
